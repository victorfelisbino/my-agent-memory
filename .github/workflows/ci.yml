name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  script-sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Bash syntax
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          files=( ./**/*.sh )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No bash scripts found"
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "parse: $f"
            bash -n "$f"
          done

      - name: Validate PowerShell parse
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Path . -Filter *.ps1 -File -Recurse
          if (-not $files) {
            Write-Host 'No PowerShell scripts found'
            exit 0
          }
          foreach ($file in $files) {
            Write-Host "parse: $($file.FullName)"
            $null = [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$null)
          }
          Write-Host 'PowerShell parse OK'

  docs-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs
        run: python -m pip install --upgrade pip mkdocs mkdocs-material

      - name: Build site (strict)
        run: python -m mkdocs build --strict

  competence-map-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Drift check
        shell: pwsh
        run: ./scripts/generate-competence-map.ps1 -CheckOnly

  admission-gate-harness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run PowerShell scorer on v4 fixture
        shell: pwsh
        run: ./admission-gate/score-memory.ps1 -FailUnder 85

      - name: Run Python scorer on v4 fixture
        run: python admission-gate/score_memory.py --fail-under 85

      - name: Quick smoke contract (README 60-second path)
        shell: pwsh
        run: |
          # Keep path: must return decision=keep and exit code 0.
          $keep = '{"text":"Always validate input at system boundaries."}' | python admission-gate/score_memory.py --score-one
          if ($LASTEXITCODE -ne 0) { Write-Error "quick smoke keep wrong exit: $LASTEXITCODE"; exit 1 }
          $keepDecision = ($keep | ConvertFrom-Json).decision
          if ($keepDecision -ne 'keep') { Write-Error "quick smoke keep wrong decision: $keepDecision"; exit 1 }

          # Reject path: must return decision=reject and exit code 3.
          $reject = '{"text":"Session started 2026-05-26 at 09:00 on office-pc."}' | python admission-gate/score_memory.py --score-one
          if ($LASTEXITCODE -ne 3) { Write-Error "quick smoke reject wrong exit: $LASTEXITCODE"; exit 1 }
          $rejectDecision = ($reject | ConvertFrom-Json).decision
          if ($rejectDecision -ne 'reject') { Write-Error "quick smoke reject wrong decision: $rejectDecision"; exit 1 }
          Write-Host 'Quick smoke contract OK (keep=0, reject=3)'
          # The reject path legitimately leaves $LASTEXITCODE=3, which Actions' pwsh
          # wrapper propagates as the step exit code. Reset it explicitly.
          exit 0

      - name: Cross-language parity (v4 fixture)
        shell: pwsh
        run: ./admission-gate/parity-check.ps1 -Fixture admission-gate/fixtures/memories-v4.jsonl

      - name: Run PowerShell scorer on v5 fixture with store (contradiction-against-store)
        shell: pwsh
        run: ./admission-gate/score-memory.ps1 -Fixture admission-gate/fixtures/memories-v5.jsonl -Store admission-gate/fixtures/store-anchors.jsonl -FailUnder 85

      - name: Run Python scorer on v5 fixture with store (contradiction-against-store)
        run: python admission-gate/score_memory.py --fixture admission-gate/fixtures/memories-v5.jsonl --store admission-gate/fixtures/store-anchors.jsonl --fail-under 85

      - name: Cross-language parity (v5 fixture with store)
        shell: pwsh
        run: ./admission-gate/parity-check.ps1 -Fixture admission-gate/fixtures/memories-v5.jsonl -Store admission-gate/fixtures/store-anchors.jsonl

      - name: Run PowerShell scorer on v6 fixture with store + recalled (feedback-loop)
        shell: pwsh
        run: ./admission-gate/score-memory.ps1 -Fixture admission-gate/fixtures/memories-v6.jsonl -Store admission-gate/fixtures/store-anchors.jsonl -Recalled admission-gate/fixtures/recalled-session.jsonl -FailUnder 85

      - name: Run Python scorer on v6 fixture with store + recalled (feedback-loop)
        run: python admission-gate/score_memory.py --fixture admission-gate/fixtures/memories-v6.jsonl --store admission-gate/fixtures/store-anchors.jsonl --recalled admission-gate/fixtures/recalled-session.jsonl --fail-under 85

      - name: Cross-language parity (v6 fixture with store + recalled)
        shell: pwsh
        run: ./admission-gate/parity-check.ps1 -Fixture admission-gate/fixtures/memories-v6.jsonl -Store admission-gate/fixtures/store-anchors.jsonl -Recalled admission-gate/fixtures/recalled-session.jsonl

      - name: Re-extract real-memory corpus and score (unlabeled smoke)
        shell: pwsh
        run: |
          ./admission-gate/extract-corpus.ps1 -Out admission-gate/fixtures/real-memory.ci.jsonl
          ./admission-gate/score-memory.ps1 -Fixture admission-gate/fixtures/real-memory.ci.jsonl -Unlabeled -ShowWorst 5

      - name: Cross-language parity (real corpus)
        shell: pwsh
        run: ./admission-gate/parity-check.ps1 -Fixture admission-gate/fixtures/real-memory.ci.jsonl

      - name: Cross-language parity (real corpus with store)
        shell: pwsh
        run: ./admission-gate/parity-check.ps1 -Fixture admission-gate/fixtures/real-memory.ci.jsonl -Store admission-gate/fixtures/store-anchors.jsonl

      - name: Cross-language parity (real corpus with store + recalled)
        shell: pwsh
        run: ./admission-gate/parity-check.ps1 -Fixture admission-gate/fixtures/real-memory.ci.jsonl -Store admission-gate/fixtures/store-anchors.jsonl -Recalled admission-gate/fixtures/recalled-session.jsonl

      - name: Dashboard smoke (iter 12)
        shell: pwsh
        run: |
          $log = 'admission-gate/logs/ci.jsonl'
          ./admission-gate/score-memory.ps1 -Fixture admission-gate/fixtures/memories-v6.jsonl -Store admission-gate/fixtures/store-anchors.jsonl -Recalled admission-gate/fixtures/recalled-session.jsonl -LogTo $log
          python admission-gate/score_memory.py --fixture admission-gate/fixtures/memories-v6.jsonl --store admission-gate/fixtures/store-anchors.jsonl --recalled admission-gate/fixtures/recalled-session.jsonl --log-to $log
          ./admission-gate/render-dashboard.ps1 -LogPath $log -OutPath admission-gate/dashboard.ci.html
          $html = Get-Content admission-gate/dashboard.ci.html -Raw
          if ($html -notmatch 'Admission gate dashboard') { Write-Error 'Dashboard missing title'; exit 1 }
          if ($html -notmatch 'Contradiction-against-store hits') { Write-Error 'Dashboard missing contradiction section'; exit 1 }
          if ($html -notmatch 'Feedback-loop hits') { Write-Error 'Dashboard missing feedback-loop section'; exit 1 }
          Write-Host "Dashboard smoke OK ($(($html.Length)) chars)"

      - name: Score-one smoke (single-candidate gate contract)
        shell: pwsh
        run: |
          # Score-one mode: a keep candidate exits 0; a reject candidate exits 3. Same shape from PS and Python.
          $keep = '{"text":"Always run mkdocs --strict before pushing docs changes."}'
          $reject = '{"text":"today I fixed the bug at line 42 in src/foo.py"}'

          $psKeep = $keep | pwsh -NoProfile -File admission-gate/score-memory.ps1 -ScoreOne
          if ($LASTEXITCODE -ne 0) { Write-Error "PS score-one keep wrong exit: $LASTEXITCODE"; exit 1 }
          $psReject = $reject | pwsh -NoProfile -File admission-gate/score-memory.ps1 -ScoreOne
          if ($LASTEXITCODE -ne 3) { Write-Error "PS score-one reject wrong exit: $LASTEXITCODE"; exit 1 }

          $pyKeep = $keep | python admission-gate/score_memory.py --score-one
          if ($LASTEXITCODE -ne 0) { Write-Error "Py score-one keep wrong exit: $LASTEXITCODE"; exit 1 }
          $pyReject = $reject | python admission-gate/score_memory.py --score-one
          if ($LASTEXITCODE -ne 3) { Write-Error "Py score-one reject wrong exit: $LASTEXITCODE"; exit 1 }

          # Cross-language decision parity for score-one (decision field, not exit code).
          $psKeepDecision = ($psKeep | ConvertFrom-Json).decision
          $pyKeepDecision = ($pyKeep | ConvertFrom-Json).decision
          $psRejectDecision = ($psReject | ConvertFrom-Json).decision
          $pyRejectDecision = ($pyReject | ConvertFrom-Json).decision
          if ($psKeepDecision -ne $pyKeepDecision) { Write-Error "score-one parity mismatch on keep: ps=$psKeepDecision py=$pyKeepDecision"; exit 1 }
          if ($psRejectDecision -ne $pyRejectDecision) { Write-Error "score-one parity mismatch on reject: ps=$psRejectDecision py=$pyRejectDecision"; exit 1 }
          Write-Host 'Score-one smoke OK (keep=0, reject=3, cross-language parity)'
          # Reset the leftover exit code 3 from the reject-path scorer call.
          exit 0

